name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        run: ./scripts/package_dmg.sh

      - name: Build ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/VideoCompressor.app \
            dist/VideoCompressor-arm64.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VideoCompressor-arm64.dmg
            dist/VideoCompressor-arm64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
